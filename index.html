<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Daily Receivable Cash Supabase</title>
<style>html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Arial,sans-serif}.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center}.bb-card{background:#fff;border:1px solid #d9e2ef;border-radius:14px;padding:22px 28px;box-shadow:0 8px 30px #173a6615;color:#17457a;font-weight:800}.bb-sub{margin-top:6px;color:#6b7280;font-size:12px;font-weight:600}</style>
</head>
<body>
<div class="bb-loader"><div class="bb-card">Loading BIG BROTHER Receivable Cash Summary…<div class="bb-sub">Supabase user + location permissions</div></div></div>
<script>
(async function(){
  try{
    const response=await fetch('legacy-google-v2.html?v=20260910-1',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load Receivable Cash Summary source.');
    let html=await response.text();

    const adapter='<scr'+'ipt src="supabase-receivable-cash-adapter.js?v=20260910-1"></scr'+'ipt>';
    const headClose=html.toLowerCase().indexOf('</head>');
    if(headClose<0)throw new Error('Receivable Cash Summary source is missing </head>.');
    html=html.slice(0,headClose)+adapter+'\n'+html.slice(headClose);

    const marker='(async function init(){';
    const replacement=`fetchJson=window.BBDailyReceivableCashAdapter.fetchJson;\nshowCache=function(){return false;};\nsaveCache=function(){};\nloadLocations=async function(){\n  locationMap=await window.BBDailyReceivableCashAdapter.locationMap();\n  return locationMap;\n};\n\n(async function init(){\n  try{\n    await window.BBDailyReceivableCashAdapter.ensureSession();\n    const profile=await window.BBDailyReceivableCashAdapter.accessProfile();\n    const label=profile?.staff?.staffName||profile?.user?.email||'Signed in';\n    const pill=document.querySelector('.topbar .pill');if(pill)pill.textContent='Supabase · '+label;\n  }catch(error){\n    showError(error?.message||'Daily Receivable Cash Summary access denied.');\n    $("syncStatus").textContent='Supabase sign-in required';\n    $("body").innerHTML='<tr><td colspan="14" class="empty">Sign in to BIG BROTHER to view this report.</td></tr>';\n    return;\n  }`;
    if(!html.includes(marker))throw new Error('Receivable Cash Summary initialization marker was not found.');
    html=html.replace(marker,replacement);
    html=html.replace('<title>BIG BROTHER — Daily Receivable Cash Collection V2</title>','<title>BIG BROTHER — Daily Receivable Cash Supabase</title>');
    html=html.replace('Payment Source = Receivable','Supabase · Receivable Cash');

    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-card">Could not open Receivable Cash Summary<div class="bb-sub">'+String(error?.message||error)+'</div></div></div>';
  }
})();
</script>
</body>
</html>
